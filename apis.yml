image: https://10ml.com/og/pages/en/home.png

description: 10ML Fragrance Index API provides free, no‑auth access to a curated fragrance knowledge base covering over 5,400 perfumes, 249 houses,
  and detailed note pyramids, accords, families, and usage guides. The service is hosted at mcp.10ml.com and draws its data from the 10ML retail
  site, offering read‑only tools for searching, comparing, and retrieving perfume information in multiple languages, aimed at AI assistants and
  developers.

